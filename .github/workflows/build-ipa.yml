# 서명 없는 kgeoScan.ipa 를 만든다 (공개 저장소라 macOS 러너 무료).
# - push 마다: 아티팩트 kgeoScan-ipa
# - 기본 브랜치 push: 롤링 프리릴리스 "latest" 의 kgeoScan.ipa 교체
# - 태그 v*: 정식 릴리스
# 설치는 INSTALL_WINDOWS.md (Sideloadly + 무료 Apple ID).
name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: kgeoScan
  APP_NAME: kgeoScan

jobs:
  build:
    name: xcodebuild (unsigned, Release, iphoneos)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          sw_vers
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$SCHEME.xcodeproj" -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP" || { echo "::error::$APP not found"; ls -R build/Build/Products | head -50; exit 1; }
          rm -rf Payload "$APP_NAME.ipa"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr -y "$APP_NAME.ipa" Payload
          ls -la "$APP_NAME.ipa"
          unzip -l "$APP_NAME.ipa" | head -20
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgeoScan-ipa
          path: kgeoScan.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Move rolling "latest" tag
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release (latest / tag)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest (unsigned build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: kgeoScan.ipa
          body: |
            서명 없는 kgeoScan.ipa 입니다. 커밋 ${{ github.sha }} 에서 빌드.
            Windows 에서 Sideloadly 로 설치: INSTALL_WINDOWS.md 참고.
