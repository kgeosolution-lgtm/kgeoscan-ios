# 서명 없는 kgeoScan.ipa 를 만든다 (공개 저장소라 macOS 러너 무료).
# - push 마다: 아티팩트 kgeoScan-ipa
# - 기본 브랜치 push: 롤링 프리릴리스 "latest" 의 kgeoScan.ipa 교체
# - 태그 v*: 정식 릴리스
# - 빌드 실패: 오류 줄을 annotation 과 프리릴리스 "ci-logs" 의 xcodebuild.log / errors.txt 로 공개 (로그인 없이 읽기 위해)
# 설치는 INSTALL_WINDOWS.md (Sideloadly + 무료 Apple ID).
name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: kgeoScan
  APP_NAME: kgeoScan

jobs:
  build:
    name: xcodebuild (unsigned, Release, iphoneos)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          sw_vers
          swift --version

      # 색 점 미리보기 셰이더는 앱이 실행 중에 소스로 컴파일한다 → 여기서 같은 소스를 미리 컴파일해 오류를 잡는다
      - name: Check Metal shader source (point preview)
        run: |
          set +e
          OUT="$RUNNER_TEMP/points.metal"
          awk '/^ *\/\/ kgeo-msl-begin/{f=1} f{print} /^ *\/\/ kgeo-msl-end/{f=0}' StrayScanner/Kgeo/PointCloudRenderer.swift > "$OUT"
          echo "extracted $(wc -l < "$OUT") lines"
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal toolchain not found; downloading the component"
            xcodebuild -downloadComponent MetalToolchain
          fi
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "::warning title=metal::Metal toolchain unavailable - shader source not checked"
            exit 0
          fi
          xcrun -sdk iphoneos metal -c "$OUT" -o "$RUNNER_TEMP/points.air" > "$RUNNER_TEMP/metal.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/metal.log"
          if [ $status -ne 0 ]; then
            msg=$(grep -E "error" "$RUNNER_TEMP/metal.log" | head -12)
            [ -n "$msg" ] || msg=$(head -20 "$RUNNER_TEMP/metal.log")
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            msg="${msg//$'\r'/'%0D'}"
            echo "::error title=metal shader::${msg:0:1500}"
            exit 1
          fi
          echo "Metal shader OK"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$SCHEME.xcodeproj" -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Collect errors (on failure)
        if: failure()
        run: |
          grep -nE "error:|BUILD FAILED|fatal error:|Undefined symbol|ld: |xcodebuild: error" build/xcodebuild.log | head -300 > build/errors.txt || true
          echo "=== errors.txt ==="
          cat build/errors.txt
          {
            echo "## xcodebuild errors (run ${{ github.run_id }})"
            echo '```'
            head -150 build/errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 로그인 없이 API 로 볼 수 있도록 annotation 으로도 올린다 (step 당 10개 제한 → 4줄씩 묶음)
          grep -E "error:" build/xcodebuild.log | grep -vE "^[[:space:]]*note:" | sort -u | head -40 > build/err_lines.txt || true
          if [ -s build/err_lines.txt ]; then
            split -l 4 build/err_lines.txt build/errchunk_
            for f in build/errchunk_*; do
              msg=$(cat "$f")
              msg="${msg//'%'/'%25'}"
              msg="${msg//$'\n'/'%0A'}"
              msg="${msg//$'\r'/'%0D'}"
              echo "::error title=xcodebuild::${msg:0:1500}"
            done
          else
            tail -40 build/xcodebuild.log > build/tail.txt
            msg=$(cat build/tail.txt)
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            msg="${msg//$'\r'/'%0D'}"
            echo "::error title=xcodebuild tail::${msg:0:1500}"
          fi

      - name: Publish log for anonymous download (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI logs (last failed build)
          prerelease: true
          body: "마지막 실패 빌드의 xcodebuild 로그. run ${{ github.run_id }}, commit ${{ github.sha }}"
          files: |
            build/xcodebuild.log
            build/errors.txt

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP" || { echo "::error::$APP not found"; ls -R build/Build/Products | head -50; exit 1; }
          rm -rf Payload "$APP_NAME.ipa"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr -y "$APP_NAME.ipa" Payload
          ls -la "$APP_NAME.ipa"
          unzip -l "$APP_NAME.ipa" | head -20
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgeoScan-ipa
          path: kgeoScan.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Move rolling "latest" tag
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release (latest / tag)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest (unsigned build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: kgeoScan.ipa
          body: |
            서명 없는 kgeoScan.ipa 입니다. 커밋 ${{ github.sha }} 에서 빌드.
            Windows 에서 Sideloadly 로 설치: INSTALL_WINDOWS.md 참고.
